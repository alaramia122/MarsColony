name: Backend and web validation (Stages 1–3)

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/scenarios/**"
      - "data/starter_presets/**"
      - "data/entity_catalogs/**"
      - "data/entity_catalogs/**"
      - "docker-compose.yml"
      - ".github/workflows/stage1-backend.yml"
      - "docs/**"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/scenarios/**"
      - "data/starter_presets/**"
      - "docker-compose.yml"
      - ".github/workflows/stage1-backend.yml"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

  domain-and-api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marscolony
          POSTGRES_USER: marscolony
          POSTGRES_PASSWORD: marscolony-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marscolony -d marscolony"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://marscolony:marscolony-ci@localhost:5432/marscolony
      MARS_COLONY_POSTGRES_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend and tooling modules
        run: python -m compileall -q backend tools
      - name: Apply PostgreSQL migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Run domain and PostgreSQL integration tests
        run: python -m unittest discover -s backend/tests -v
      - name: Print backend campaign acceptance report
        run: python tools/backend_campaign_report.py
      - name: Validate scenario JSON
        run: python -m json.tool data/scenarios/ares-01.json > /dev/null
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start the complete Compose stack
        run: docker compose up --build -d
      - name: Verify database, API, web client and recovery
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready > /dev/null && curl -fsS http://localhost:8080/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/openapi.json | python -c "
          import json,sys
          spec=json.load(sys.stdin)
          assert '/api/v1/sessions' in spec['paths']
          assert '/api/v1/sessions/{session_id}/advance' in spec['paths']
          assert '/api/v1/sessions/{session_id}/players' in spec['paths']
          assert '/api/v1/sessions/{session_id}/projects' in spec['paths']
          assert '/api/v1/scenarios/{scenario_id}/starter-presets' in spec['paths']
          assert '/api/v1/sessions/{session_id}/entity-catalog' in spec['paths']
          assert '/api/v1/sessions/{session_id}/entity-catalog/proposals' in spec['paths']
          assert '/health/ready' in spec['paths']
          "
          curl -fsS http://localhost:8000/api/v1/scenarios/ares-01/starter-presets | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['presets']) == 4; assert all(len(p['domain_packs']) == 16 for p in d['presets'])"
          python -m json.tool data/entity_catalogs/ares-01.json > /dev/null
          SESSION_DATA=$(curl -fsS -X POST http://localhost:8000/api/v1/sessions \
            -H "Content-Type: application/json" \
            -d '{"scenario_id":"ares-01","starter_preset_id":"industrial"}' | python -c "import json,sys; s=json.load(sys.stdin); print(s['id'], s['owner_token'])")
          read SESSION_ID OWNER_TOKEN <<< "$SESSION_DATA"
          curl -fsS "http://localhost:8000/api/v1/sessions/$SESSION_ID/entity-catalog" -H "X-Player-Token: $OWNER_TOKEN" | python -c "import json,sys; d=json.load(sys.stdin); ids={item['id'] for item in d['entities']}; assert {'solar_array','advanced_bioreactor','emergency_water_contingency'} <= ids"
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
          echo "OWNER_TOKEN=$OWNER_TOKEN" >> "$GITHUB_ENV"
          curl -fsS -X POST "http://localhost:8000/api/v1/sessions/$SESSION_ID/advance" \
            -H "X-Player-Token: $OWNER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"expected_period":0}' > /dev/null
          docker compose restart db
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U marscolony -d marscolony; then break; fi
            sleep 2
          done
          docker compose restart api
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS "http://localhost:8000/api/v1/sessions/$SESSION_ID" \
            -H "X-Player-Token: $OWNER_TOKEN" | python -c "
          import json,sys
          session=json.load(sys.stdin)
          assert session['current_period'] == 1, session
          assert session['starter_preset']['id'] == 'industrial', session
          assert len({domain for asset in session['state']['infrastructure'] for domain in asset['domain_codes']}) == 16, session
          assert len(session['events']) == 2, session
          assert abs(session['state']['oxygen_kg'] - 1328.57556) < 1e-5, session
          "
      - name: Stop the complete Compose stack
        if: always()
        run: docker compose down -v
