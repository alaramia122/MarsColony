name: Stage 1 backend validation

on:
  pull_request:
    paths:
      - "backend/**"
      - "data/scenarios/**"
      - "docker-compose.yml"
      - ".github/workflows/stage1-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/scenarios/**"
      - "docker-compose.yml"
      - ".github/workflows/stage1-backend.yml"

permissions:
  contents: read

jobs:
  domain-and-api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marscolony
          POSTGRES_USER: marscolony
          POSTGRES_PASSWORD: marscolony-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marscolony -d marscolony"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://marscolony:marscolony-ci@localhost:5432/marscolony
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run domain and API persistence tests
        run: python -m unittest discover -s backend/tests -v
      - name: Validate scenario JSON
        run: python -m json.tool data/scenarios/ares-01.json > /dev/null
      - name: Apply PostgreSQL migrations
        run: alembic -c backend/alembic.ini upgrade head
