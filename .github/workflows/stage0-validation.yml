name: Stage 0 validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scenario-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON scenario
        run: python -m json.tool data/scenarios/ares-01.json > /dev/null
      - name: Run deterministic scenario tests
        run: python -m unittest discover -s tests -v
      - name: Run scenario report
        run: python tools/scenario_sim.py
